[project]
name = "docket-review"
version = "0.1.0"
requires-python = ">=3.11"
description = "Synthetic document extraction, source validation and durable review"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
